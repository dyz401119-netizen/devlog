# ---------------------------------------------------------------------------
# 【HTTP-ONLY 模式】博客站点配置
#
# 当前用途：域名未备案期间，通过 http://服务器公网IP 访问验证站点。
# 此模式下不启用 HTTPS，也不申请证书。
#
# 切换到 HTTPS 后请改用 00-default.conf + site.conf（见 *.https-template），
# 并删除本文件，避免 80 端口冲突。
#
# 【重要】charset 必须设置，否则中文在部分浏览器/抓取器下会乱码。
# 【重要】凡是在 location 里写了 add_header 的，都要 include 安全头片段，
#         否则 Nginx 会丢弃 server 级别的 add_header（继承陷阱）。
# ---------------------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 中文站必须显式声明 UTF-8
    charset utf-8;
    charset_types text/css application/javascript application/json
                  application/xml application/rss+xml text/plain;

    # --- 安全响应头（server 级别，供未写 add_header 的 location 兜底）---
    include /etc/nginx/snippets/security-headers.conf;

    # --- 压缩 ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/woff font/woff2;

    # ---- 健康检查 ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 安全：禁止访问隐藏文件与源码配置 ----
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
    location ~* \.(toml|yaml|yml|lock)$ {
        deny all;
    }

    # ---- 留言板页面：禁止缓存 ----
    #
    # 【为什么单独处理】
    # 实测遇到：浏览器缓存了旧版留言板页面（引用了已废弃的 unpkg CDN），
    # 即使用户强制刷新也可能命中缓存，导致组件不初始化、点提交没反应。
    # 这里对留言板页面设 no-store，确保每次访问都拿最新版本。
    #
    # 注意：正则 location 优先于前缀 location，所以这条要写在 \.html$ 之前。
    # 留言板页面：禁止缓存（正则匹配，保证优先级高于通用 \.html$ 规则）
    location ^~ /message-board/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        # 先按常规静态文件处理，找不到就回退到目录 index
        try_files $uri $uri/index.html =404;
    }

    # ---- 静态资源：长缓存 ----
    # 注意：本块有 add_header，必须重新 include 安全头
    location ~* \.(?:css|js|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # ---- HTML：短缓存，保证文章更新后能马上看到 ----
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    # ---- 留言板 / 评论后端：反代到 Waline 容器 ----
    #
    # 【路径改写说明（实测踩坑）】
    # Waline 的接口都挂在 /api/ 下（如 /api/comment、/api/user）。
    # 前端请求的是 /comment/api/comment，所以必须把 /comment 前缀剥掉再转发，
    # 否则容器收到 /comment/api/comment 会匹配不到路由。
    #
    # proxy_pass 结尾带 URI（这里是 /），Nginx 会用 / 替换掉匹配的 location 前缀 /comment/。
    # 即：/comment/api/comment  ->  /api/comment  ✅
    location /comment/ {
        proxy_pass http://waline:8360/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- 主路由 ----
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ---- 404 页面 ----
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
