# ---------------------------------------------------------------------------
# Nginx 主配置（覆盖镜像默认值）
#
# 优化点（每一项都经过压测验证）：
#   worker_connections 1024 -> 10240     提高单 worker 并发处理能力
#   tcp_nopush on + tcp_nodelay on        小包合并发送，减少网络往返
#   access_log 缓冲                     减少每请求的系统调用
#   open_file_cache                     缓存文件句柄，减少 open() 开销
#   keepalive_requests 10000            长连接复用更多请求
# ---------------------------------------------------------------------------

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  10240;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式：$request_time 便于观察服务端处理耗时
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    # 日志缓冲：攒够 32k 或 5 秒再落盘，显著减少 write 系统调用
    access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;
    keepalive_requests 10000;

    types_hash_max_size 2048;
    server_tokens off;

    # 打开文件缓存：静态站点收益极大
    open_file_cache          max=2000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    client_max_body_size 2m;
    client_body_timeout  12s;
    client_header_timeout 12s;
    send_timeout         10s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/woff font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
